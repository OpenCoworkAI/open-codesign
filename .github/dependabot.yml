version: 2
# Batch routine version updates monthly; security updates keep their own cadence.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
      time: "06:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 2
    labels:
      - chore
      - area:build
    commit-message:
      prefix: chore
      include: scope
    groups:
      electron:
        applies-to: version-updates
        patterns:
          - electron
          - electron-builder
          - "@electron/*"
      pi:
        applies-to: version-updates
        patterns:
          - "@mariozechner/pi-*"
          - "@earendil-works/pi-*"
      react:
        applies-to: version-updates
        patterns:
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"
      radix:
        applies-to: version-updates
        patterns:
          - "@radix-ui/*"
      tailwind:
        applies-to: version-updates
        patterns:
          - tailwindcss
          - "@tailwindcss/*"
      development-tools:
        applies-to: version-updates
        dependency-type: development
        patterns:
          - "*"
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: "06:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 1
    labels:
      - chore
      - area:build
    commit-message:
      prefix: chore
      include: scope
    groups:
      actions:
        applies-to: version-updates
        patterns:
          - "*"
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
