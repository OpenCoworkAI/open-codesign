name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.1.0). Must start with "v"'
        required: true
        type: string
      draft:
        description: 'Create as draft release'
        required: false
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

jobs:
  # ------------------------------------------------------------------
  # Gate: lint / typecheck / test on ubuntu only (fast, cheap).
  # Full matrix is already covered by ci.yml on PRs; we just need a
  # quick sanity pass before we spend runner-minutes on packaging.
  # ------------------------------------------------------------------
  gate:
    name: Gate (lint · typecheck · test)
    runs-on: ubuntu-latest
    if: github.repository == 'OpenCoworkAI/open-codesign'
    env:
      RELEASE_REF: ${{ github.event_name == 'push' && github.ref || format('refs/tags/{0}', inputs.tag) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.RELEASE_REF }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: env -u ELECTRON_SKIP_BINARY_DOWNLOAD -u ELECTRON_SKIP_DOWNLOAD pnpm install --frozen-lockfile --ignore-scripts=false

      - name: Install Electron binary
        run: |
          env -u ELECTRON_SKIP_BINARY_DOWNLOAD -u ELECTRON_SKIP_DOWNLOAD pnpm -C apps/desktop exec node -e "
          const { execFileSync } = require('node:child_process');
          const path = require('node:path');
          const electronDir = path.dirname(require.resolve('electron/package.json'));
          execFileSync(process.execPath, [path.join(electronDir, 'install.js')], { stdio: 'inherit' });
          "

      - name: Verify Electron binary
        run: |
          env -u ELECTRON_SKIP_BINARY_DOWNLOAD -u ELECTRON_SKIP_DOWNLOAD pnpm -C apps/desktop exec node -e "
          const fs = require('node:fs');
          const electronPath = require('electron');
          fs.accessSync(electronPath, fs.constants.X_OK);
          console.log(electronPath);
          "

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  changelog:
    name: Build changelog
    runs-on: ubuntu-latest
    if: github.repository == 'OpenCoworkAI/open-codesign'
    permissions:
      contents: read
      pull-requests: read
    env:
      RELEASE_REF: ${{ github.event_name == 'push' && github.ref || format('refs/tags/{0}', inputs.tag) }}
    outputs:
      changelog: ${{ steps.build.outputs.changelog }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.RELEASE_REF }}
          fetch-depth: 0

      - name: Build changelog
        id: build
        uses: mikepenz/release-changelog-builder-action@c9dc8369bccbc41e0ac887f8fd674f5925d315f7 # v5
        with:
          configurationJson: |
            {
              "categories": [
                {
                  "title": "### Features",
                  "labels": ["feat"],
                  "rules": [{ "pattern": "^feat", "on_property": "title" }]
                },
                {
                  "title": "### Bug Fixes",
                  "labels": ["fix"],
                  "rules": [{ "pattern": "^fix", "on_property": "title" }]
                },
                {
                  "title": "### Documentation",
                  "labels": ["docs"],
                  "rules": [{ "pattern": "^docs", "on_property": "title" }]
                },
                {
                  "title": "### Other Changes",
                  "rules": [{ "pattern": "^(chore|refactor|perf|test|ci)", "on_property": "title" }]
                }
              ],
              "ignore_labels": ["skip-changelog"],
              "sort": { "order": "DESC", "on_property": "mergedAt" },
              "template": "#{{CHANGELOG}}\n\n**Full Changelog**: #{{RELEASE_DIFF}}"
            }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ------------------------------------------------------------------
  # Build: native packaging per platform.
  # electron-builder reads publish config from electron-builder.yml.
  # We do NOT sign in v0.1 — notarization deferred to Stage 2.
  # ------------------------------------------------------------------
  build:
    name: Build (${{ matrix.label }})
    needs: [gate, changelog]
    strategy:
      fail-fast: false
      matrix:
        # macOS ships Apple Silicon (arm64) only, built natively on macos-latest.
        include:
          - os: macos-latest # arm64 Apple Silicon runner
            label: macos
            artifact_name: installer-macos
            artifact_glob: 'apps/desktop/release/*.dmg'
          - os: windows-latest
            label: windows-latest
            artifact_name: installer-windows-latest
            artifact_glob: |
              apps/desktop/release/*.exe
              apps/desktop/release/*.zip
          - os: ubuntu-latest
            label: ubuntu-latest
            artifact_name: installer-ubuntu-latest
            artifact_glob: |
              apps/desktop/release/*.AppImage
              apps/desktop/release/*.deb
              apps/desktop/release/*.rpm
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_REF: ${{ github.event_name == 'push' && github.ref || format('refs/tags/{0}', inputs.tag) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.RELEASE_REF }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: env -u ELECTRON_SKIP_BINARY_DOWNLOAD -u ELECTRON_SKIP_DOWNLOAD pnpm install --frozen-lockfile --ignore-scripts=false

      - name: Install Electron binary
        run: |
          env -u ELECTRON_SKIP_BINARY_DOWNLOAD -u ELECTRON_SKIP_DOWNLOAD pnpm -C apps/desktop exec node -e "
          const { execFileSync } = require('node:child_process');
          const path = require('node:path');
          const electronDir = path.dirname(require.resolve('electron/package.json'));
          execFileSync(process.execPath, [path.join(electronDir, 'install.js')], { stdio: 'inherit' });
          "

      - name: Verify Electron binary
        run: |
          env -u ELECTRON_SKIP_BINARY_DOWNLOAD -u ELECTRON_SKIP_DOWNLOAD pnpm -C apps/desktop exec node -e "
          const fs = require('node:fs');
          const electronPath = require('electron');
          fs.accessSync(electronPath, fs.constants.X_OK);
          console.log(electronPath);
          "

      # electron-builder's rpm target shells out to `rpmbuild`, which is not
      # present on ubuntu-latest by default. Install it on Linux runners only.
      - name: Install Linux packaging deps
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends rpm

      # Build all workspace packages (turborepo respects dep graph)
      - name: Build workspace
        run: pnpm --filter '!@open-codesign/desktop' -r build

      # Package the Electron app.
      # CSC_IDENTITY_AUTO_DISCOVERY=false: skip ad-hoc Mac signing prompt.
      # WIN_CSC_LINK / WIN_CSC_KEY_PASSWORD: intentionally unset (no cert in v0.1).
      # On macOS we build only the Apple Silicon (arm64) DMG on macos-latest,
      # then verify the packaged Mach-O architecture before upload.
      - name: Package desktop (non-mac)
        if: runner.os != 'macOS'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm --filter @open-codesign/desktop release

      - name: Package desktop (mac, arm64)
        if: runner.os == 'macOS'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pnpm --filter @open-codesign/desktop exec electron-vite build
          pnpm --filter @open-codesign/desktop exec bash scripts/package-macos-dmg.sh --mac dmg:arm64 --publish never

      - name: Verify macOS app architecture
        if: runner.os == 'macOS'
        run: bash apps/desktop/scripts/verify-macos-app.sh apps/desktop/release arm64

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: error
          retention-days: 7

  # ------------------------------------------------------------------
  # Snap: best-effort build of a .snap on ubuntu using snapcraft.
  # Isolated into its own job because snapcraft is heavyweight and
  # occasionally flakes on hosted runners; failure here should NOT
  # block the release (publish job does not `needs:` this one).
  # ------------------------------------------------------------------
  build-snap:
    name: Build Linux Snap (best-effort)
    needs: [gate]
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      RELEASE_REF: ${{ github.event_name == 'push' && github.ref || format('refs/tags/{0}', inputs.tag) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.RELEASE_REF }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: env -u ELECTRON_SKIP_BINARY_DOWNLOAD -u ELECTRON_SKIP_DOWNLOAD pnpm install --frozen-lockfile --ignore-scripts=false

      - name: Install Electron binary
        run: |
          env -u ELECTRON_SKIP_BINARY_DOWNLOAD -u ELECTRON_SKIP_DOWNLOAD pnpm -C apps/desktop exec node -e "
          const { execFileSync } = require('node:child_process');
          const path = require('node:path');
          const electronDir = path.dirname(require.resolve('electron/package.json'));
          execFileSync(process.execPath, [path.join(electronDir, 'install.js')], { stdio: 'inherit' });
          "

      - name: Verify Electron binary
        run: |
          env -u ELECTRON_SKIP_BINARY_DOWNLOAD -u ELECTRON_SKIP_DOWNLOAD pnpm -C apps/desktop exec node -e "
          const fs = require('node:fs');
          const electronPath = require('electron');
          fs.accessSync(electronPath, fs.constants.X_OK);
          console.log(electronPath);
          "

      - name: Install snapcraft + LXD
        # snapcraft itself handles most simple electron-builder builds via
        # `snap pack`, but recent electron-builder (post core22/core24) will
        # fall back to invoking snapcraft which needs LXD for its build
        # environment. Setting both up here keeps the step resilient.
        run: |
          sudo snap install snapcraft --classic
          sudo snap install lxd
          sudo lxd waitready --timeout=60
          sudo lxd init --auto

      - name: Build workspace
        run: pnpm --filter '!@open-codesign/desktop' -r build

      - name: Package snap
        working-directory: apps/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm exec electron-vite build && pnpm exec electron-builder --linux snap --publish never

      - name: Upload snap artifact
        # Inspection-only artifact: snap packaging is intentionally best-effort
        # and is not attached to the GitHub Release by publish/provenance.
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: installer-snap
          path: apps/desktop/release/*.snap
          if-no-files-found: warn
          retention-days: 7

  # ------------------------------------------------------------------
  # Supply-chain: checksums + CycloneDX SBOM for the whole workspace.
  # Runs on one runner after all platform artifacts are uploaded.
  # ------------------------------------------------------------------
  provenance:
    name: Checksums + SBOM
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    env:
      RELEASE_REF: ${{ github.event_name == 'push' && github.ref || format('refs/tags/{0}', inputs.tag) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.RELEASE_REF }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Download all installers
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist/
          merge-multiple: true

      - name: Generate CycloneDX SBOM (workspace)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: cyclonedx-json
          output-file: dist/open-codesign-${{ github.event_name == 'push' && github.ref_name || inputs.tag }}-sbom.cdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Generate SHA256SUMS.txt
        working-directory: dist
        run: |
          shopt -s nullglob
          : > SHA256SUMS.txt
          for f in *; do
            [ -f "$f" ] && [ "$f" != "SHA256SUMS.txt" ] || continue
            sha256sum "$f" >> SHA256SUMS.txt
          done
          cat SHA256SUMS.txt

      - name: Upload provenance artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: provenance
          path: |
            dist/SHA256SUMS.txt
            dist/open-codesign-*-sbom.cdx.json
          if-no-files-found: error
          retention-days: 7

  # ------------------------------------------------------------------
  # Publish: create (or update draft) GitHub Release and attach files.
  # ------------------------------------------------------------------
  publish:
    name: Publish GitHub Release
    needs: [build, changelog, provenance]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    env:
      RELEASE_REF: ${{ github.event_name == 'push' && github.ref || format('refs/tags/{0}', inputs.tag) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.RELEASE_REF }}
          fetch-depth: 0

      - name: Validate tag input on dispatch
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [[ ! "${{ inputs.tag }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::tag must be semver-like (e.g. v1.2.3 or v1.2.3-rc.1)"
            exit 1
          fi
          # Verify the tag exists on the remote before proceeding
          if ! git ls-remote --tags origin "refs/tags/${{ inputs.tag }}" | grep -q "${{ inputs.tag }}"; then
            echo "::error::tag '${{ inputs.tag }}' does not exist on origin"
            exit 1
          fi

      - name: Download all installers
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist/
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
          name: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
          body: ${{ needs.changelog.outputs.changelog }}
          draft: ${{ github.event_name == 'push' && false || inputs.draft }}
          prerelease: ${{ contains(github.event_name == 'push' && github.ref_name || inputs.tag, '-') }}
          files: dist/**
          fail_on_unmatched_files: false
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ------------------------------------------------------------------
  # Sync in-repo distribution manifests (cask / scoop / winget / flatpak)
  # to the freshly-published release. Pulls SHA256SUMS.txt from the
  # release, rewrites version strings + checksums + URLs across all four
  # channels, and opens a checked PR so the packaging/ tree
  # stays in sync without a manual step.
  # Skipped until RELEASE_BOT_TOKEN is set (see packaging/README.md).
  # ------------------------------------------------------------------
  bump-manifests:
    name: Sync packaging manifests to release
    needs: [publish]
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' && !contains(github.ref_name, '-')) || (github.event_name == 'workflow_dispatch' && inputs.draft == false && !contains(inputs.tag, '-'))
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Guard on secret
        id: guard
        env:
          RELEASE_BOT_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN }}
        run: |
          if [ -z "$RELEASE_BOT_TOKEN" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::RELEASE_BOT_TOKEN not set — skipping packaging manifest sync PR. See packaging/README.md."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: steps.guard.outputs.skip == 'false'
        with:
          # Generate the PR from main; never push directly to the protected branch.
          ref: main
          fetch-depth: 0
          token: ${{ secrets.RELEASE_BOT_TOKEN }}

      - name: Derive version from tag
        if: steps.guard.outputs.skip == 'false'
        id: ver
        run: |
          release_ref="${{ github.event_name == 'push' && github.ref_name || inputs.tag }}"
          version="${release_ref#v}"
          echo "release_ref=${release_ref}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Run update-shas.sh
        if: steps.guard.outputs.skip == 'false'
        run: ./packaging/update-shas.sh "${{ steps.ver.outputs.version }}"

      - name: Open manifest sync PR
        if: steps.guard.outputs.skip == 'false'
        run: bash .github/scripts/sync-release-manifests.sh
        env:
          GH_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN }}
          RELEASE_TAG: ${{ steps.ver.outputs.release_ref }}

  # ------------------------------------------------------------------
  # Homebrew Cask bump — opens a PR against OpenCoworkAI/homebrew-tap
  # with the new version + sha256 of the mac DMGs.
  # Skipped until HOMEBREW_TAP_TOKEN is set (see packaging/homebrew/README.md).
  # ------------------------------------------------------------------
  homebrew:
    name: Bump Homebrew Cask
    needs: [publish]
    runs-on: macos-latest
    if: (github.event_name == 'push' && !contains(github.ref_name, '-')) || (github.event_name == 'workflow_dispatch' && inputs.draft == false && !contains(inputs.tag, '-'))
    steps:
      - name: Guard on secret
        id: guard
        run: |
          if [ -z "${{ secrets.HOMEBREW_TAP_TOKEN }}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::HOMEBREW_TAP_TOKEN not set — skipping Homebrew bump. See packaging/homebrew/README.md."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout source
        if: steps.guard.outputs.skip == 'false'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: source
          ref: ${{ github.event_name == 'push' && github.ref || 'main' }}

      - name: Generate cask from release checksums
        if: steps.guard.outputs.skip == 'false'
        working-directory: source
        run: |
          release_ref="${{ github.event_name == 'push' && github.ref_name || inputs.tag }}"
          ./packaging/update-shas.sh "${release_ref#v}"

      - name: Checkout Homebrew tap
        if: steps.guard.outputs.skip == 'false'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: OpenCoworkAI/homebrew-tap
          path: homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Commit + push cask
        if: steps.guard.outputs.skip == 'false'
        run: |
          mkdir -p homebrew-tap/Casks
          cp source/packaging/homebrew/Casks/open-codesign.rb homebrew-tap/Casks/open-codesign.rb
          cd homebrew-tap
          if git diff --quiet Casks/open-codesign.rb; then
            echo "::notice::Homebrew tap already up to date — no commit"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/open-codesign.rb
          git commit -m "open-codesign ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}"
          git push
